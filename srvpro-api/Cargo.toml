[package]
name = "srvpro-api"
version = "0.1.4"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "HTTP API and persistence backend for the srvpro duel server."
readme = "README.md"
keywords = ["ygopro", "api"]
categories = ["web-programming::http-server"]

[dependencies]
anymap3 = { version = "1", default-features = false, features = ["hashbrown"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.8", features = ["ws"] }
arc-swap = "1"
base64 = "0.23"
chrono = "0.4"
linkme = "0.3"
futures = "0.3"
hashbrown = "0.17"
log = "0.4"
parking_lot = "0.12"
rand = "0.8"
ring = "0.17"
rusqlite = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
serde_yaml = "0.8"
slotmap = "1.1"
tower-http = { version = "0.6", features = ["fs"] }
http-body-util = { version = "0.1", optional = true }
include_bytes_aligned = { version = "0.2", optional = true }
web-static-pack = { version = "0.5", optional = true }

srvpro = { workspace = true, features = ["zip", "card", "forge", "official"] }
ygopro-data = { version = "0", features = ["hashbrown"] }
ygopro-derive = "0"
ygopro-handler = { version = "0", default-features = false }

[features]
embedded-portal = ["dep:http-body-util", "dep:include_bytes_aligned", "dep:web-static-pack"]
