[package]
name = "srvpro-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anymap3 = { version = "1", default-features = false, features = ["hashbrown"] }
arc-swap = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
tower = { version = "0.5", features = ["util"] }
linkme = "0.3"
futures = "0.3"
hashbrown = "0.17"
log = "0.4"
parking_lot = "0.12"
rand = "0.8"
ring = "0.17"
rusqlite = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
serde_yaml = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }

srvpro = { path = "../srvpro" }
ygopro-data = { version = "0", default-features = false }
ygopro-derive = "0"
ygopro-handler = { version = "0", default-features = false }
